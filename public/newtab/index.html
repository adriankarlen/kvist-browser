<!-- based on https://github.com/ch4zex/localnoteboard -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kvist</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Two layouts; --kv-newtab-style in the theme picks one. -->
    <main id="start" aria-label="Start">
      <p id="start-greeting"></p>
      <div id="start-clock" aria-live="off">00:00</div>
      <p id="start-date"></p>
      <form id="start-search" role="search">
        <span
          class="kv-icon"
          style="--kv-icon-image: var(--kv-icon-search)"
          aria-hidden="true"
        ></span>
        <input
          id="start-query"
          name="q"
          type="search"
          placeholder="Search or enter address"
          aria-label="Search or enter address"
          autocomplete="off"
          spellcheck="false"
        />
      </form>
      <nav id="start-links" aria-label="Quick links"></nav>
    </main>

    <div id="dashboard-wrapper">
      <h1 id="title">kvist://newtab/</h1>
      <div id="dashboard-container">
        <!-- Clock -->
        <section class="box clock-box" aria-labelledby="clock-header">
          <h2 class="header" id="clock-header">SYSTEM: TIME</h2>
          <div class="clock-display" id="clock">00:00:00</div>
        </section>

        <!-- Quick Links -->
        <section class="box links-box" aria-labelledby="links-header">
          <h2 class="header" id="links-header">SYSTEM: QUICK_ACCESS</h2>
          <div class="links-grid" id="links-grid"></div>
        </section>

        <!-- Scratchpad -->
        <section class="box scratchpad-box" aria-labelledby="scratchpad-header">
          <h2 class="header" id="scratchpad-header">
            <span>SYSTEM: SCRATCHPAD</span>
            <span>TEMP_STORAGE</span>
          </h2>
          <textarea
            id="scratchpad-area"
            aria-label="Scratchpad"
            placeholder="> TEMPORARY_DATA_"
            spellcheck="false"
          ></textarea>
        </section>
      </div>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
