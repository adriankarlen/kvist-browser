<!-- based on https://github.com/ch4zex/localnoteboard -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kvist</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div id="dashboard-wrapper">
      <h1 id="title">kvist://newtab/</h1>
      <div id="dashboard-container">
        <!-- Clock -->
        <div class="box clock-box">
          <h2 class="header">SYSTEM: TIME</h2>
          <div class="clock-display" id="clock">00:00:00</div>
        </div>

        <!-- Quick Links -->
        <div class="box links-box">
          <h2 class="header">SYSTEM: QUICK_ACCESS</h2>
          <div class="links-grid" id="links-grid"></div>
        </div>

        <!-- Scratchpad -->
        <div class="box scratchpad-box">
          <h2 class="header">
            <span>SYSTEM: SCRATCHPAD</span>
            <span>TEMP_STORAGE</span>
          </h2>
          <textarea
            id="scratchpad-area"
            placeholder="> TEMPORARY_DATA_"
            spellcheck="false"
          ></textarea>
        </div>
      </div>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
