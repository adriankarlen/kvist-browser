name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version-file: ".node-version"
          cache: true

      - run: vp run build

      - run: vp run test
